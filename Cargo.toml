[package]
name = "vibedither"
version = "1.1.0"
edition = "2021"

[profile.release]
opt-level = 3        # Maximum optimizations
lto = true           # Link Time Optimization (smaller/faster binary)
codegen-units = 1    # Better optimizations at the cost of build time
panic = 'abort'      # Removes stack unwinding code (saves space)
strip = true         # Automatically strips symbols (removes debug bloat)

[dependencies]
eframe = { version = "0.27.2", features = ["wgpu", "persistence"] }
wgpu = "0.19.4"
image = { version = "0.24.9", features = ["png", "jpeg", "webp"] }
rfd = "0.14.1"
arboard = "3.4.0"
bytemuck = { version = "1.15.0", features = ["derive"] }
pollster = "0.3.0"
log = "0.4.21"
env_logger = "0.11.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1.0.81"
parking_lot = "0.12.1"

[build-dependencies]
# Future: embed icon or manifest